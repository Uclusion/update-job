name: 'Update Uclusion'
description: 'Update Uclusion job from push'
branding:
  icon: 'check-square'
  color: 'green'
inputs:
  secret_key_id:
    description: 'Uclusion secret key id'
    required: true
  secret_key:
    description: 'Uclusion secret key'
    required: true
  workspace_id:
    description: 'Uclusion workspace id'
    required: true
  github-event-message:
    description: 'The push message with Uclusion job code'
    required: true
  label:
    description: 'Label applied to the job when it has a commit not yet deployed'
    required: false
    default: 'Awaiting deploy'

# Composite on the runner's own python3 (entrypoint.py is stdlib only) so a run never depends on pulling an
# image from Docker Hub. Inputs go through env, never inlined into the script, so a commit message cannot
# inject shell.
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        UCLUSION_SECRET_KEY_ID: ${{ inputs.secret_key_id }}
        UCLUSION_SECRET_KEY: ${{ inputs.secret_key }}
        UCLUSION_WORKSPACE_ID: ${{ inputs.workspace_id }}
        UCLUSION_EVENT_MESSAGE: ${{ inputs.github-event-message }}
        UCLUSION_LABEL: ${{ inputs.label }}
      run: >-
        python3 -B "$GITHUB_ACTION_PATH/entrypoint.py" "$UCLUSION_SECRET_KEY_ID" "$UCLUSION_SECRET_KEY"
        "$UCLUSION_WORKSPACE_ID" "$UCLUSION_EVENT_MESSAGE" "$UCLUSION_LABEL"
